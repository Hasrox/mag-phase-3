# MAG-PRD-1.1 hyperparameters. Hash of this file is written on every impression.
# Changing a value does not reset a profile; a differing hash forces a rebuild
# from the log (section 6.6). Do not rename an existing feature.

[meta]
spec = "MAG-PRD-1.1"
version = "1.1"

[runtime]
host = "127.0.0.1"
port = 8080
ctx_size = 8192
# 4096 was too small once the safety rubric and the schema are in the prompt.
# The image tokens plus the prompt consumed the whole window and generation was
# truncated at 4095 tokens before any JSON was emitted, so every tag failed to
# parse. 8192 leaves room for the answer.
n_gpu_layers = "all"
parallel = 1
min_decode_tps = 15.0
min_vram_gb = 16.0
host_buffer_max_mib = 64.0
# Note: a fully offloaded Q6_K still maps ~787 MiB into host memory (CPU_Mapped),
# so this absolute cap is applied as a ratio against the CUDA buffer in
# mag.gate.check_log, not on its own. A 64 MiB cap read literally would reject
# every correct run.
memory_delta_ratio = 0.85
# Advisory only. Q6_K is memory-mapped, so the resident VRAM is about 0.85 of the
# file size (8041 MiB measured against a 9.26 GB model on an RTX 4080). The hard
# evidence that the weights reached the GPU is the CUDA0 model buffer line in the
# server log, checked by mag.gate.check_log.
image_long_side = 1024
# A full-resolution vision encode of a 12B model on one consumer GPU takes much
# longer than a text decode. 60 s was measured far too short: the first tagged
# image timed out at 60 s and again at 120 s before this was raised.
tag_timeout_s = 600
# The answer is 14 short JSON fields. Bounded so a runaway generation cannot
# consume the whole context, which is what truncated every response at ctx 4096.
tag_max_tokens = 400
tag_retry_temperature = 0.2
tag_conf_min = 0.5
prompt_version = "1.1.0"

[pool]
min_images = 20
min_compositions = 60
image_cooldown_cap = 60
composition_cooldown = 200
skip_cooldown_mult = 3
abandon_minutes = 30
# Sounds served in the last N impressions are kept out of the prior slots.
# Until real tags exist every image shares one prior, so the same file would
# otherwise return on every other draw.
sound_repeat_window = 8

[ranker]
alpha = 0.5
sd_r_init = 0.28
block_size = 5
coverage_rated = 25
explore_window = 20
explore_cap = 0.20
refactor_every = 200
skip_train_value = 0.25
skip_train_weight = 0.5
lambda_bias = 0.1
lambda_a = 1.0
lambda_b = 4.0
lambda_c = 3.0
sound_top_priors = 2
sound_explore = 1
prior_strength = 2.0

[reward]
star_1 = 0.00
star_2 = 0.25
star_3 = 0.50
star_4 = 0.75
star_5 = 1.00

[sound]
target_lufs = -16.0
# Operator override 2026-09-30. Do not trim. Do not reject on length.
# Playback uses the first play_cap_s seconds. The file is stored whole.
max_duration_s = 8.0
play_cap_s = 8.0
accept_over_cap = true
warn_duration_s = 2.5
lufs_tolerance = 1.0
onset_db = -40.0
# Operator override 2026-09-30. Loudnorm was added and rejected. Import measures
# loudness, onset, and duration for reporting only. It never writes
# assets/sounds/norm and never gates on the measurement. The UI serves the
# stored original file from assets.path.
write_normalized_copy = false

[render]
min_font_px = 18
max_font_px = 64
bar_height = 96
margin = 16
# font_file is tried first. font_fallbacks are only consulted when it is missing.
# A font must resolve: the renderer raises RenderRejected rather than silently
# drawing with ImageFont.load_default(), which ignores the requested size.
font_file = "assets/fonts/DejaVuSans-Bold.ttf"
font_fallbacks = [
  "C:/Windows/Fonts/impact.ttf",
  "C:/Windows/Fonts/arialbd.ttf",
  "C:/Windows/Fonts/arial.ttf",
]

[eval]
bootstrap_n = 10000
bootstrap_seed = 1103
s2_min_n = 100
s2_min_holdout = 20
s2_min_delta = 0.05
sim_noise_sd = 0.15
null_noise_sd = 0.28
